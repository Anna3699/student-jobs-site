<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Thinking &amp; Learning Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#EDF0F3; --sheet:#FFFFFF; --ink:#16202E; --muted:#586577; --line:#D6DCE3;
  --pen:#23479B; --pen-ink:#FFFFFF; --omr:#E7B3C4; --omr-soft:#FBF1F4; --warn:#B3261E; --ok:#1F7A4D;
  --shadow:0 1px 2px rgba(22,32,46,.06),0 4px 16px rgba(22,32,46,.05);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F141B; --sheet:#171F29; --ink:#E6EBF1; --muted:#9BA7B6; --line:#2A3441;
    --pen:#86A8FF; --pen-ink:#0F141B; --omr:#8E5468; --omr-soft:#221A21; --warn:#FF8A80; --ok:#6FD19F;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F141B; --sheet:#171F29; --ink:#E6EBF1; --muted:#9BA7B6; --line:#2A3441;
  --pen:#86A8FF; --pen-ink:#0F141B; --omr:#8E5468; --omr-soft:#221A21; --warn:#FF8A80; --ok:#6FD19F;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,6vw,40px)}
h2{font-size:clamp(22px,4.6vw,28px)}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.progress{display:flex;gap:4px}
.progress span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress span.on{background:var(--pen)}
.progress span.now{background:var(--omr)}
.lead{max-width:62ch}
/* OMR bubbles */
.bub{appearance:none;-webkit-appearance:none;border:2px solid var(--omr);background:var(--omr-soft);color:var(--ink);
  width:44px;height:44px;border-radius:50%;font:600 15px/1 var(--mono);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .12s,border-color .12s,transform .08s;padding:0;flex:none}
.bub:hover{border-color:var(--pen)}
.bub:active{transform:scale(.94)}
.bub[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.item{display:grid;grid-template-columns:52px 1fr;gap:4px 12px;padding:16px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:4px}
.item.missing .qid{color:var(--warn)}
.qid{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.qtext{grid-column:2}
.row{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
@media (max-width:560px){.item{grid-template-columns:1fr;gap:4px}.qtext,.row,.pair,.opts,.ml{grid-column:1}.row{gap:10px}}
.scale-ends{grid-column:2;display:flex;justify-content:space-between;max-width:260px;font-size:12px;color:var(--muted);margin-top:2px}
.legend{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--ground);padding-block:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.legend b{font-family:var(--mono);color:var(--ink)}
/* choice cards */
.pair{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
@media (max-width:520px){.pair{grid-template-columns:1fr}}
.choice{appearance:none;-webkit-appearance:none;text-align:left;font:inherit;color:inherit;background:var(--sheet);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;width:100%}
.choice .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--omr);background:var(--omr-soft);flex:none;margin-top:2px;font:600 12px/18px var(--mono);text-align:center;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--pen)}
.choice[aria-pressed="true"] .dot{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.opts{grid-column:2;display:flex;flex-direction:column;gap:8px;margin-top:10px}
/* most/least */
.ml{grid-column:2;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mlrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.mlbtns{display:flex;gap:6px}
.tag{appearance:none;-webkit-appearance:none;font:600 13px/1 var(--body);padding:9px 12px;border-radius:999px;border:2px solid var(--omr);background:var(--omr-soft);color:var(--ink);cursor:pointer}
.tag.most[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tag.least[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
/* inputs */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
label.f span.h{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;-webkit-appearance:none;appearance:none}
textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:460px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle;font-size:15px}
.tbl th{font-size:13px;color:var(--muted);font-weight:700}
.tbl input{padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* reading */
.passage{font-size:18px;line-height:1.7;max-width:62ch}
.passage.gone{filter:blur(8px);user-select:none;-webkit-user-select:none;pointer-events:none}
/* timer */
.timer{display:flex;align-items:center;gap:12px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
.timer .clock{font:500 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.timer .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--pen);transition:width 1s linear}
.timer.low .clock{color:var(--warn)}
.timer.low .bar i{background:var(--warn)}
/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot .note{font-size:13px;color:var(--muted);flex:1;min-width:180px}
.btn{appearance:none;-webkit-appearance:none;font:700 16px/1 var(--body);padding:14px 22px;border-radius:12px;border:0;background:var(--pen);color:var(--pen-ink);cursor:pointer}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--pen);border:2px solid var(--pen)}
.err{color:var(--warn);font-size:14px;font-weight:700}
.startcards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.startcards{grid-template-columns:1fr}}
.startcards .sheet{display:flex;flex-direction:column;gap:10px}
code.big{display:block;font:500 13px/1.5 var(--mono);word-break:break-all;background:var(--omr-soft);border:1px dashed var(--omr);border-radius:10px;padding:12px;max-height:180px;overflow:auto;user-select:all;-webkit-user-select:all}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-family:var(--mono);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

": "Learn how electricity is generated in a power plant", "b": "Learn how the heart pumps blood around the body"}, {"id": "C8", "a": "Keep and balance the accounts of a family business", "b": "Solve a hard algebra problem"}, {"id": "C9", "a": "Take part in an inter-school debate competition", "b": "Build a working model for a science exhibition"}, {"id": "C10", "a": "Help run a stall at a trade fair", "b": "Volunteer at a free health check-up camp"}, {"id": "C11", "a": "Memorise the parts of the human brain and their functions", "b": "Memorise the causes and events of the French Revolution"}, {"id": "C12", "a": "Read about how the stock market works", "b": "Read the life story of a freedom fighter"}], "DB": [{"id": "D1", "a": "Be the spokesperson of a club", "b": "Be the treasurer of a club"}, {"id": "D2", "a": "Make a gadget from scratch", "b": "Write an article for a magazine"}, {"id": "D3", "a": "Understand how the kidneys clean the blood", "b": "Understand how a solar panel produces electricity"}, {"id": "D4", "a": "Plan how a business can earn more than it spends", "b": "Program a machine to do a job automatically"}, {"id": "D5", "a": "Talk to people about how government decisions affect them", "b": "Look at living tissue under a microscope"}, {"id": "D6", "a": "Learn 50 important dates and events in Indian history", "b": "Learn the names of 50 bones in the human body"}, {"id": "D7", "a": "Investigate how a great civilisation fell", "b": "Work out the maths behind a rocket launch"}, {"id": "D8", "a": "Prepare a profit-and-loss statement for a shop", "b": "Crack a difficult geometry problem"}, {"id": "D9", "a": "Engineer buildings that survive earthquakes", "b": "Research how diseases spread and how to stop them"}, {"id": "D10", "a": "Assist a doctor for a day", "b": "Shadow a businessperson for a day"}, {"id": "D11", "a": "Learn how banks decide who gets a loan", "b": "Learn how the Indian Constitution was written"}, {"id": "D12", "a": "Test how a new drug work       h+='<p class="lead muted">Write real numbers, not what you think you should do.</p><div class="sheet stack">';
      H_ITEMS.forEach(function(it){
        h+='<label class="f" for="in-'+it.id+'"><span><span class="qid">'+it.id+'</span>&nbsp; '+it.q+'</span><span style="display:flex;gap:10px;align-items:center"><input '+(it.num?'type="number" inputmode="decimal" min="0"':'type="text"')+' id="in-'+it.id+'" data-id="'+it.id+'" value="'+esc(st.a[it.id]||"")+'">'+(it.unit?'<span class="muted" style="font-weight:400">'+it.unit+'</span>':'')+'</span></label>';
      });
      h+='</div>';
      break;
    case "open":
      h+='<p class="lead muted">Two to four sentences each. Spelling doesn’t matter.</p><div class="sheet stack">';
      DATA.O.forEach(function(it){
        h+='<label class="f" for="in-'+it.id+'"><span><span class="qid">'+it.id+'</span>&nbsp; '+it.q+'</span><textarea id="in-'+it.id+'" data-id="'+it.id+'">'+esc(st.a[it.id]||"")+'</textarea></label>';
      });
      h+='</div>';
      note="This is the last part.";
      break;
    case "observer":
      h+='<p class="lead muted">Rate what you have <b>actually seen her do</b> over the past year. Fill this in on your own, without seeing her answers.</p>';
      h+='<div class="legend"><span><b>1</b> Never</span><span><b>2</b> Rarely</span><span><b>3</b> Sometimes</span><span><b>4</b> Often</span><span><b>5</b> Very often</span></div><div class="sheet">';
      X_ITEMS.forEach(function(x){ h+='<div class="item" id="it-'+x[0]+'"><div class="qid">'+x[0]+'</div><div class="qtext">'+esc(x[1])+'</div>'+bubbleRow(x[0],["1","2","3","4","5"])+'</div>' });
      h+='</div><div class="sheet stack">';
      [["X12","Which subject does she score well in with the least effort?"],["X13","Which subject does she complain about the most?"],["X14","What has she said she wants to become, and has it changed over time?"],["X15","Your relationship to her (parent, teacher, other)"]].forEach(function(x){
        h+='<label class="f" for="in-'+x[0]+'"><span><span class="qid">'+x[0]+'</span>&nbsp; '+x[1]+'</span><input type="text" id="in-'+x[0]+'" data-id="'+x[0]+'" value="'+esc(st.a[x[0]]||"")+'"></label>';
      });
      h+='</div>';
      note="";
      break;
  }
  h+='<p class="err" id="err" hidden></p>';
  app.innerHTML=h;
  foot.hidden=false; footnote.textContent=note;
  nextBtn.textContent = (st.step===plan.length-1) ? "Finish" : "Continue";
  nextBtn.disabled=false;
  if(p.k==="read1"||p.k==="read2"){ startTimer("rd_"+p.k,90,function(){ var el=document.getElementById("passage"); if(el){el.textContent="Time’s up. The passage is hidden now.";el.classList.add("muted")} footnote.textContent="Time’s up. Tap Continue."; }) }
  if(p.k==="aptA"||p.k==="aptB"){ startTimer(p.k,p.secs,function(){ st.a[p.k+"_timeout"]=true; advance(true) }); keepAwake() }
  window.scrollTo(0,0);
}

function startTimer(key,total,onEnd){
  var clock=document.getElementById("clock"), bar=document.getElementById("tbar"), box=document.getElementById("timer");
  var ended=false;
  function upd(){
    var left=Math.max(0,Math.round((st.deadline[key]-Date.now())/1000));
    var m=Math.floor(left/60), s=left%60;
    if(clock){clock.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s}
    if(bar){bar.style.width=(100*left/total)+"%"}
    if(box){ if(left<=Math.min(60,total*0.2)) box.classList.add("low") }
    if(left<=0 && !ended){ ended=true; clearInterval(tick); tick=null; onEnd() }
  }
  upd(); if(!ended) tick=setInterval(upd,500);
}
function keepAwake(){ try{ if(navigator.wakeLock && !wake){ navigator.wakeLock.request("screen").then(function(w){wake=w; w.addEventListener("release",function(){wake=null})}).catch(function(){}) } }catch(e){} }

/* ---------- validation ---------- */
function missing(){
  var k=PLANS[st.mode][st.step].k, ids=[];
  function need(list){ list.forEach(function(id){ if(st.a[id]===undefined||st.a[id]==="") ids.push(id) }) }
  if(k==="likertA") need(DATA.LA.map(function(x){return x.id}));
  if(k==="likertB") need(DATA.LB.map(function(x){return x.id}));
  if(k==="pickC") need(DATA.CA.map(function(x){return x.id}));
  if(k==="pickD") need(DATA.DB.map(function(x){return x.id}));
  if(k==="observer") need(X_ITEMS.map(function(x){return x[0]}));
  if(k==="scen") DATA.SC.forEach(function(sc){ if(!st.a[sc.id+"_most"]||!st.a[sc.id+"_least"]) ids.push(sc.id) });
  if(k==="recall") need(["R0"]);
  return ids;
}
function advance(force){
  var plan=PLANS[st.mode], p=plan[st.step];
  if(!force){
    var miss=missing();
    document.querySelectorAll(".item.missing").forEach(function(e){e.classList.remove("missing")});
    if(miss.length){
      var err=document.getElementById("err");
      err.hidden=false; err.textContent=miss.length+(miss.length===1?" question still needs":" questions still need")+" an answer: "+miss.slice(0,8).join(", ")+(miss.length>8?"…":"");
      miss.forEach(function(id){ var el=document.getElementById("it-"+id); if(el) el.classList.add("missing") });
      var first=document.getElementById("it-"+miss[0])||err;
      if(first.scrollIntoView) first.scrollIntoView({block:"center",behavior:"smooth"});
      return;
    }
  }
  st.parts[p.k+"_end"]=Date.now();
  if(st.step<plan.length-1){ st.step++; persist(); render() }
  else { st.done=true; st.finishedAt=Date.now(); persist(); if(wake){try{wake.release()}catch(e){}} render() }
}
nextBtn.addEventListener("click",function(){ advance(false) });

/* ---------- input delegation ---------- */
app.addEventListener("click",function(e){
  var b=e.target.closest ? e.target.closest("button[data-id]") : null;
  if(!b) return;
  var id=b.getAttribute("data-id"), v=b.getAttribute("data-v"), ml=b.getAttribute("data-ml");
  if(ml){
    var other = ml==="most"?"least":"most";
    if(st.a[id+"_"+other]===v){ delete st.a[id+"_"+other] }
    setA(id+"_"+ml,v);
    var row=b.closest(".ml");
    row.querySelectorAll("button[data-ml]").forEach(function(x){
      var m=x.getAttribute("data-ml"); x.setAttribute("aria-pressed", String(st.a[id+"_"+m]===x.getAttribute("data-v")));
    });
  } else {
    setA(id,v);
    var grp=b.parentNode.parentNode;
    grp.querySelectorAll('button[data-id="'+id+'"]').forEach(function(x){ x.setAttribute("aria-pressed", String(x.getAttribute("data-v")===v)) });
  }
  var it=document.getElementById("it-"+id); if(it) it.classList.remove("missing");
});
function onField(e){ var t=e.target; if(t && t.getAttribute && t.getAttribute("data-id")){ setA(t.getAttribute("data-id"), t.value) } }
app.addEventListener("input",onField); app.addEventListener("change",onField);

/* ---------- landing / gate / done ---------- */
function landing(){
  foot.hidden=true;
  var s1=load("sft_s1"), s2=load("sft_s2");
  var h='<div class="stack-lg"><div class="stack"><p class="eyebrow">Two sessions · about 50–60 minutes each</p><h1>Thinking &amp; Learning Profile</h1>';
  h+='<p class="lead">This is not an exam and nobody is being ranked. It helps us understand how you think, what you enjoy and how you learn best. In the “about you” parts there are no right or wrong answers, and the answers that help you most are the honest ones.</p>';
  h+='<p class="lead muted">Find a quiet place, keep your phone’s notifications off, and have rough paper and a pen ready. Some parts have a timer. You can’t go back to a part once you’ve finished it.</p></div>';
  h+='<div class="startcards">';
  if(s1&&s1.done){ h+='<div class="sheet"><p class="eyebrow">Session 1</p><h2>Done</h2><p class="muted">Your answer code is saved on this device.</p><button class="btn ghost" type="button" id="see1">Show my Session 1 code</button></div>' }
  else { h+='<div class="sheet"><p class="eyebrow">Session 1</p><h2>'+(s1?"Continue":"Start here")+'</h2><p class="muted">Marks, two short readings, about-you questions and a 25-minute thinking-skills section.</p><label class="f" for="in-name">Your first name<input type="text" id="in-name" autocomplete="given-name" value="'+esc(s1?s1.name:"")+'"></label><button class="btn" type="button" id="go1">'+(s1?"Continue Session 1":"Start Session 1")+'</button></div>' }
  if(s2&&s2.done){ h+='<div class="sheet"><p class="eyebrow">Session 2</p><h2>Done</h2><p class="muted">Your answer code is saved on this device.</p><button class="btn ghost" type="button" id="see2">Show my Session 2 code</button></div>' }
  else { h+='<div class="sheet"><p class="eyebrow">Session 2</p><h2>'+(s2?"Continue":"A few days later")+'</h2><p class="muted">The person giving you the test will send you a code when it’s time.</p>'+(s2?'':'<label class="f" for="in-code">Session 2 code<input type="text" id="in-code" autocomplete="off" autocapitalize="off"></label>')+'<button class="btn'+(s2?'':' ghost')+'" type="button" id="go2">'+(s2?"Continue Session 2":"Unlock Session 2")+'</button><p class="err" id="err2" hidden></p></div>' }
  h+='</div></div>';
  app.innerHTML=h;
  var g1=document.getElementById("go1"); if(g1) g1.onclick=function(){ var n=document.getElementById("in-name").value.trim(); st=s1||newState("s1"); if(n) st.name=n; persist(); render() };
  var g2=document.getElementById("go2"); if(g2) g2.onclick=function(){
    if(s2){ st=s2; return render() }
    var c=(document.getElementById("in-code").value||"").toLowerCase().replace(/[^a-z0-9]/g,"");
    if(c!==S2CODE){ var e=document.getElementById("err2"); e.hidden=false; e.textContent="That code doesn’t match. Check it with the person who sent you the test."; return }
    st=newState("s2"); st.name=(s1&&s1.name)||""; persist(); render();
  };
  var e1=document.getElementById("see1"); if(e1) e1.onclick=function(){ st=s1; render() };
  var e2=document.getElementById("see2"); if(e2) e2.onclick=function(){ st=s2; render() };
}
function encode(obj){
  var json=JSON.stringify(obj);
  return btoa(unescape(encodeURIComponent(json)));
}
function doneScreen(){
  foot.hidden=true;
  var payload={v:1,mode:st.mode,name:st.name,started:new Date(st.startedAt).toISOString(),finished:new Date(st.finishedAt||Date.now()).toISOString(),a:st.a,rt:st.rt,ch:st.ch,parts:st.parts,ua:navigator.userAgent.slice(0,120)};
  var code="SFT-"+st.mode.toUpperCase()+"-"+encode(payload);
  var who = st.mode==="obs" ? "Thank you. Send this code to the person who shared the form with you." : "Thank you, this session is done. Copy the code below and send it to the person who gave you the test, for example on WhatsApp.";
  var h='<div class="stack-lg"><div class="stack"><p class="eyebrow">'+(st.mode==="obs"?"Observer form":"Session "+(st.mode==="s1"?1:2))+' · complete</p><h1>All done</h1><p class="lead">'+who+'</p></div>';
  h+='<div class="sheet stack"><div class="facts"><span>Answers recorded <b>'+Object.keys(st.a).length+'</b></span><span>Code length <b>'+code.length+'</b></span></div><code class="big" id="code">'+esc(code)+'</code><div class="chips"><button class="btn" type="button" id="copy">Copy code</button><button class="btn ghost" type="button" id="home">Back to start</button></div><p class="muted" id="copied" aria-live="polite"></p></div>';
  if(st.mode==="s1") h+='<p class="muted lead">Session 2 happens a few days from now. Open this same link again and you’ll need the code you’re sent then.</p>';
  h+='</div>';
  app.innerHTML=h;
  document.getElementById("copy").onclick=function(){
    var msg=document.getElementById("copied");
    function fallback(){ var el=document.getElementById("code"); var r=document.createRange(); r.selectNodeContents(el); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent="The code is selected. Tap and hold it, then choose Copy." }
    try{ navigator.clipboard.writeText(code).then(function(){ msg.textContent="Copied. Paste it into your message." }, fallback) }catch(e){ fallback() }
  };
  document.getElementById("home").onclick=function(){ st=null; render() };
}

/* ---------- boot ---------- */
(function(){
  var hash=(location.hash||"").replace("#","");
  if(hash==="reset"){
    ["sft_s1","sft_s2","sft_obs"].forEach(function(k){ try{localStorage.removeItem(k)}catch(e){} });
    try{ history.replaceState(null,"",location.pathname) }catch(e){}
    app.innerHTML='<div class="stack-lg"><div class="stack"><p class="eyebrow">Reset</p><h1>Cleared on this device</h1><p class="lead">All saved answers in this browser have been removed. The test will start fresh.</p></div><div><button class="btn" type="button" id="fresh">Go to the start</button></div></div>';
    document.getElementById("fresh").onclick=function(){ st=null; render() };
    return;
  }
  if(hash==="observer"){ st=load("sft_obs")||newState("obs"); persist() }
  render();
})();
</script>
